<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explora</title>
<style>
  @font-face {
    font-family: 'DM Serif Text';
    src: url('assets/tipografia/DMSerifText-Regular.ttf') format('truetype');
    font-weight: 400; font-style: normal; font-display: block;
  }
  html, body {
    margin: 0; min-height: 100%;
    background: #0d0d0d; color: #ebebeb;
    font-family: 'DM Serif Text', Georgia, serif;
    text-transform: lowercase;
    display: grid; place-content: center; gap: 2rem;
    padding: 2rem; text-align: center;
  }
  h1 { margin: 0; font-size: clamp(2.5rem, 9vw, 5rem); line-height: 1; }
  p { margin: 0; font-style: italic; color: #9a9a9a; max-width: 26rem; }
  nav { display: grid; gap: .8rem; }
  .marca { width: min(15rem, 60vw); justify-self: center; opacity: .85; }
  a {
    padding: .9rem 2rem; font-size: 1.2rem; text-decoration: none;
    color: #0d0d0d; background: #d8f20a; border-radius: 4px;
  }
  a + a { color: #ebebeb; background: none; border: 2px solid #2b2b2b; }
</style>
</head>
<body>
  <img class="marca" src="assets/marca/cd.svg" alt="estudia: Creación Digital">
  <h1>Explora</h1>
  <p>Todo el que crea tiene un animal adentro.</p>
  <nav>
    <a href="movil/">Invocar mi animal</a>
    <a href="escenario/">Ver el paisaje</a>
  </nav>
</body>
</html>
